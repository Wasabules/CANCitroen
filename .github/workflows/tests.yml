name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: SDK Android 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" > /dev/null
      - name: Tests JVM
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :companion:testDebugUnitTest --console=plain
      # Build release sans la clé locale : vérifie R8 et les ressources réduites.
      - name: Build release
        working-directory: android
        run: ./gradlew :app:assembleRelease :companion:assembleRelease --console=plain

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install aiohttp
      - name: Parité des décodeurs
        run: python -m unittest scripts/test_decoders.py
